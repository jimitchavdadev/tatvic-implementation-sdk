<!--
================================================================================
TATVIC FIRST-PARTY RELAY & AD BLOCKER INTERCEPTOR (GTM CUSTOM HTML TAG)
================================================================================
INSTRUCTIONS:
1. In Google Tag Manager, navigate to: Tags -> New.
2. Select Tag Type: "Custom HTML".
3. Name this tag: "Tatvic First-Party Interceptor".
4. Copy & paste this ENTIRE file into the HTML text box.
5. Under "Triggering", select: "Consent Initialization - All Pages"
   (or "Initialization - All Pages").
6. Click Save and click Preview / Submit!
================================================================================
-->
<script>
(function() {
  'use strict';

  // --------------------------------------------------------------------------
  // 1. CONFIGURATION (Edit as needed)
  // --------------------------------------------------------------------------
  var CONFIG = {
    // Relative or absolute URL of your first-party proxy relay
    proxyEndpoint: '/_tatvic/relay',

    // Header sent to proxy containing the upstream target URL
    headerName: 'x-tatvic-target',

    // Server-Side GTM Preview Header Token (optional, for sGTM Tag Assistant preview)
    // e.g. 'ZW52LTd8a2RuTVd2blg4aVJsUkR3cmdGcHBPUXwxYTFhYjllMDdlNWIxNTI3ODQ3NDY='
    serverPreviewToken: '',

    // Set to true to see debug logs in your browser developer console
    debug: true,

    // Additional tracking domains to intercept
    customTargetDomains: [],

    // Domains to exclude from interception
    customExcludeDomains: []
  };

  // --------------------------------------------------------------------------
  // 2. IDEMPOTENCY GUARD
  // --------------------------------------------------------------------------
  if (typeof window === 'undefined') return;
  if (window.__tatvic_gtm_interceptor_installed) {
    if (CONFIG.debug) console.log('[Tatvic Interceptor] Already active on page.');
    return;
  }

  // --------------------------------------------------------------------------
  // 3. TARGET DOMAINS (Tracking / Ad / Telemetry Endpoints)
  // --------------------------------------------------------------------------
  var TARGET_DOMAINS = [
    'google-analytics.com',
    'analytics.google.com',
    'googletagmanager.com',
    'stats.g.doubleclick.net',
    'googleadservices.com',
    'googleads.g.doubleclick.net',
    'pagead2.googlesyndication.com',
    'doubleclick.net',
    'stape.io',
    'stape.net',
    'a.run.app',
    'appspot.com',
    'connect.facebook.net',
    'facebook.com',
    'graph.facebook.com',
    'facebook.net',
    'clarity.ms',
    'c.bing.com',
    'bat.bing.com',
    'analytics.tiktok.com',
    'tiktok.com',
    'static.hotjar.com',
    'script.hotjar.com',
    'in.hotjar.com',
    'static.ads-twitter.com',
    'ads-twitter.com',
    'snap.licdn.com',
    'px.ads.linkedin.com',
    'ct.pinterest.com',
    'pintrk.com',
    'sc-static.net',
    'tr.snapchat.com',
    'static.criteo.net',
    'sslwidget.criteo.com',
    'segment.io',
    'api.segment.io',
    'mixpanel.com',
    'amplitude.com',
    'posthog.com'
  ].concat(CONFIG.customTargetDomains || []);

  var EXCLUDE_DOMAINS = [
    'api.stripe.com',
    'js.stripe.com',
    'm.stripe.network',
    'paypal.com',
    'sandbox.paypal.com',
    'razorpay.com',
    'checkout.razorpay.com',
    'square.com',
    'squareup.com',
    'auth0.com',
    'clerk.dev',
    'clerk.com',
    'supabase.co',
    'firebaseio.com',
    'accounts.google.com',
    'appleid.apple.com',
    'amazonaws.com',
    'googleapis.com',
    'cloudflare.com',
    'tagassistant.google.com'
  ].concat(CONFIG.customExcludeDomains || []);

  // --------------------------------------------------------------------------
  // 4. UTILITIES
  // --------------------------------------------------------------------------
  function log() {
    if (CONFIG.debug && typeof console !== 'undefined' && console.log) {
      var args = Array.prototype.slice.call(arguments);
      args.unshift('[Tatvic Interceptor]');
      console.log.apply(console, args);
    }
  }

  function detectPreviewToken() {
    if (CONFIG.serverPreviewToken) return CONFIG.serverPreviewToken;
    try {
      if (window.location && window.location.search) {
        var params = new URLSearchParams(window.location.search);
        var t = params.get('gtm_server_preview') || params.get('x-gtm-server-preview');
        if (t) return t;
      }
      if (typeof sessionStorage !== 'undefined') {
        var s = sessionStorage.getItem('__tatvic_server_preview');
        if (s) return s;
      }
    } catch (e) {}
    return '';
  }

  var activePreviewToken = detectPreviewToken();
  if (activePreviewToken && typeof sessionStorage !== 'undefined') {
    try {
      sessionStorage.setItem('__tatvic_server_preview', activePreviewToken);
    } catch (e) {}
  }

  function isDomainMatch(hostname, pattern) {
    if (!hostname || !pattern) return false;
    hostname = hostname.toLowerCase();
    pattern = pattern.toLowerCase();
    return hostname === pattern || hostname.endsWith('.' + pattern);
  }

  function shouldProxy(urlStr) {
    if (!urlStr || typeof urlStr !== 'string') return false;
    if (urlStr.indexOf(CONFIG.proxyEndpoint) !== -1 || urlStr.indexOf('/_tatvic/') !== -1) {
      return false;
    }

    try {
      var parsed = new URL(urlStr, window.location.origin);
      if (parsed.origin === window.location.origin) return false;

      var host = parsed.hostname;
      for (var i = 0; i < EXCLUDE_DOMAINS.length; i++) {
        if (isDomainMatch(host, EXCLUDE_DOMAINS[i])) return false;
      }
      for (var j = 0; j < TARGET_DOMAINS.length; j++) {
        if (isDomainMatch(host, TARGET_DOMAINS[j])) return true;
      }
    } catch (e) {
      return false;
    }
    return false;
  }

  function getProxiedUrl(targetUrlStr) {
    var sep = CONFIG.proxyEndpoint.indexOf('?') === -1 ? '?' : '&';
    return CONFIG.proxyEndpoint + sep + '_tgt=' + encodeURIComponent(targetUrlStr);
  }

  // --------------------------------------------------------------------------
  // 5. INTERCEPT FETCH
  // --------------------------------------------------------------------------
  if (typeof window.fetch === 'function') {
    var origFetch = window.fetch;

    window.fetch = function(input, init) {
      var targetUrl = (typeof input === 'string') ? input : (input && input.url ? input.url : String(input));

      if (!shouldProxy(targetUrl)) {
        return origFetch.apply(this, arguments);
      }

      log('Intercepted fetch:', targetUrl);
      var isNoCors = (init && init.mode === 'no-cors') || (input && input.mode === 'no-cors');
      var proxyUrl = getProxiedUrl(targetUrl);

      if (typeof Request !== 'undefined' && input instanceof Request) {
        var headers = new Headers(input.headers);
        if (init && init.headers) {
          new Headers(init.headers).forEach(function(val, key) {
            headers.set(key, val);
          });
        }
        if (!isNoCors) headers.set(CONFIG.headerName, targetUrl);
        if (activePreviewToken && !headers.has('x-gtm-server-preview')) {
          headers.set('x-gtm-server-preview', activePreviewToken);
        }

        var proxiedRequest = new Request(proxyUrl, {
          method: (init && init.method) || input.method,
          headers: headers,
          body: (init && init.body !== undefined) ? init.body : input.body,
          mode: isNoCors ? 'cors' : ((init && init.mode) || input.mode || 'cors'),
          credentials: (init && init.credentials) || input.credentials || 'include',
          cache: (init && init.cache) || input.cache,
          redirect: (init && init.redirect) || input.redirect,
          referrer: (init && init.referrer) || input.referrer,
          integrity: (init && init.integrity) || input.integrity,
          keepalive: (init && init.keepalive !== undefined) ? init.keepalive : input.keepalive,
          signal: (init && init.signal) || input.signal
        });

        return origFetch.call(this, proxiedRequest);
      }

      var requestHeaders = new Headers(init && init.headers);
      if (!isNoCors) requestHeaders.set(CONFIG.headerName, targetUrl);
      if (activePreviewToken && !requestHeaders.has('x-gtm-server-preview')) {
        requestHeaders.set('x-gtm-server-preview', activePreviewToken);
      }

      var modifiedInit = Object.assign({}, init, {
        headers: requestHeaders,
        mode: isNoCors ? 'cors' : ((init && init.mode) || 'cors'),
        credentials: (init && init.credentials) || 'include'
      });

      return origFetch.call(this, proxyUrl, modifiedInit);
    };

    Object.assign(window.fetch, origFetch);
  }

  // --------------------------------------------------------------------------
  // 6. INTERCEPT XHR
  // --------------------------------------------------------------------------
  if (typeof XMLHttpRequest !== 'undefined' && XMLHttpRequest.prototype) {
    var origOpen = XMLHttpRequest.prototype.open;
    var origSend = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
      var targetUrl = String(url);
      if (shouldProxy(targetUrl)) {
        log('Intercepted XHR:', targetUrl);
        this.__tatvic_proxied = true;
        this.__tatvic_target = targetUrl;
        return origOpen.call(this, method, getProxiedUrl(targetUrl), async !== false, user, password);
      }
      this.__tatvic_proxied = false;
      return origOpen.apply(this, arguments);
    };

    XMLHttpRequest.prototype.send = function(body) {
      if (this.__tatvic_proxied) {
        try {
          this.setRequestHeader(CONFIG.headerName, this.__tatvic_target);
          if (activePreviewToken) {
            this.setRequestHeader('x-gtm-server-preview', activePreviewToken);
          }
        } catch (e) {}
      }
      return origSend.apply(this, arguments);
    };
  }

  // --------------------------------------------------------------------------
  // 7. INTERCEPT SENDBEACON
  // --------------------------------------------------------------------------
  if (typeof navigator !== 'undefined' && typeof navigator.sendBeacon === 'function') {
    var origSendBeacon = navigator.sendBeacon.bind(navigator);

    navigator.sendBeacon = function(url, data) {
      var targetUrl = String(url);
      if (!shouldProxy(targetUrl)) {
        return origSendBeacon(url, data);
      }

      log('Intercepted sendBeacon:', targetUrl);
      var proxyUrl = getProxiedUrl(targetUrl);

      if (typeof window.fetch === 'function') {
        var headers = new Headers();
        headers.set(CONFIG.headerName, targetUrl);
        if (activePreviewToken) {
          headers.set('x-gtm-server-preview', activePreviewToken);
        }

        try {
          window.fetch(proxyUrl, {
            method: 'POST',
            body: data,
            headers: headers,
            keepalive: true,
            mode: 'cors',
            credentials: 'include'
          }).catch(function() {});
          return true;
        } catch (e) {}
      }

      return origSendBeacon(proxyUrl, data);
    };
  }

  // --------------------------------------------------------------------------
  // 8. INTERCEPT DYNAMIC SCRIPTS (Morphed GTM & Pixels)
  // --------------------------------------------------------------------------
  if (typeof HTMLScriptElement !== 'undefined') {
    var scriptDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
    if (scriptDesc && scriptDesc.set && scriptDesc.get) {
      var origScriptSet = scriptDesc.set;
      var origScriptGet = scriptDesc.get;

      Object.defineProperty(HTMLScriptElement.prototype, 'src', {
        set: function(val) {
          if (typeof val === 'string') {
            // Morph Google Tag Manager container loading
            if (val.indexOf('googletagmanager.com/gtm.js') !== -1 || val.indexOf('/_tatvic/gtm.js') !== -1) {
              try {
                var targetUrl = new URL(val, window.location.origin);
                var containerId = targetUrl.searchParams.get('cid') ||
                                  targetUrl.searchParams.get('container') ||
                                  targetUrl.searchParams.get('tag') ||
                                  targetUrl.searchParams.get('id') ||
                                  'GTM-T32XGF8F';

                var morphedParams = new URLSearchParams();
                morphedParams.set('cid', containerId);

                targetUrl.searchParams.forEach(function(v, k) {
                  if (k !== 'id' && k !== 'cid' && k !== 'container' && k !== 'tag') {
                    morphedParams.set(k, v);
                  }
                });

                if (window.location && window.location.search) {
                  var pParams = new URLSearchParams(window.location.search);
                  var flags = ['gtm_debug', 'gtm_auth', 'gtm_preview', 'gtm_cookies_win'];
                  for (var i = 0; i < flags.length; i++) {
                    if (pParams.has(flags[i]) && !morphedParams.has(flags[i])) {
                      morphedParams.set(flags[i], pParams.get(flags[i]));
                    }
                  }
                }

                var stealthLoader = '/_tatvic/loader.js?' + morphedParams.toString();
                log('Morphed GTM script src:', val, '->', stealthLoader);
                return origScriptSet.call(this, stealthLoader);
              } catch (e) {}
            }

            // Other tracking scripts
            if (shouldProxy(val)) {
              var proxied = getProxiedUrl(val);
              log('Intercepted dynamic script:', val, '->', proxied);
              return origScriptSet.call(this, proxied);
            }
          }
          return origScriptSet.call(this, val);
        },
        get: function() {
          return origScriptGet.call(this);
        },
        configurable: true,
        enumerable: true
      });
    }
  }

  // --------------------------------------------------------------------------
  // 9. INTERCEPT TRACKING PIXELS (<img src="...">)
  // --------------------------------------------------------------------------
  if (typeof HTMLImageElement !== 'undefined') {
    var imgDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    if (imgDesc && imgDesc.set && imgDesc.get) {
      var origImgSet = imgDesc.set;
      var origImgGet = imgDesc.get;

      Object.defineProperty(HTMLImageElement.prototype, 'src', {
        set: function(val) {
          if (typeof val === 'string' && shouldProxy(val)) {
            var proxied = getProxiedUrl(val);
            log('Intercepted pixel:', val, '->', proxied);
            return origImgSet.call(this, proxied);
          }
          return origImgSet.call(this, val);
        },
        get: function() {
          return origImgGet.call(this);
        },
        configurable: true,
        enumerable: true
      });
    }
  }

  window.__tatvic_gtm_interceptor_installed = true;
  log('Tatvic First-Party Interceptor initialized successfully via GTM.');
})();
</script>
