<!--
================================================================================
GTM CONTAINER OVERWRITE SNIPPET (Container: GTM-T32XGF8F)
================================================================================
Drop this snippet into:
  - GTM -> Tags -> New -> Custom HTML Tag (Fires on Consent Initialization)
  OR
  - Directly in the <head> of any webpage you are testing.
================================================================================
-->
<script>
(function() {
  'use strict';

  var TARGET_CONTAINER_ID = 'GTM-T32XGF8F';
  var LOADER_ENDPOINT = '/_tatvic/loader.js'; // or 'https://www.googletagmanager.com/gtm.js'
  var DEBUG = true;

  function log() {
    if (DEBUG && typeof console !== 'undefined' && console.log) {
      var args = Array.prototype.slice.call(arguments);
      args.unshift('[GTM Overwrite]');
      console.log.apply(console, args);
    }
  }

  function buildTargetUrl(origSrc) {
    var pageSearch = (window.location && window.location.search) ? window.location.search : '';
    var pageParams = new URLSearchParams(pageSearch);
    var isStealth = LOADER_ENDPOINT.indexOf('/_tatvic/') !== -1 || LOADER_ENDPOINT.indexOf('loader.js') !== -1;
    var params = new URLSearchParams();

    params.set(isStealth ? 'cid' : 'id', TARGET_CONTAINER_ID);

    if (origSrc) {
      try {
        var parsed = new URL(origSrc, window.location.origin);
        parsed.searchParams.forEach(function(val, key) {
          if (key !== 'id' && key !== 'cid' && key !== 'container' && key !== 'tag') {
            params.set(key, val);
          }
        });
      } catch (e) {}
    }

    var flags = ['gtm_debug', 'gtm_auth', 'gtm_preview', 'gtm_cookies_win'];
    for (var i = 0; i < flags.length; i++) {
      if (pageParams.has(flags[i]) && !params.has(flags[i])) {
        params.set(flags[i], pageParams.get(flags[i]));
      }
    }

    var sep = LOADER_ENDPOINT.indexOf('?') === -1 ? '?' : '&';
    return LOADER_ENDPOINT + sep + params.toString();
  }

  // 1. Intercept dynamic script tags
  if (typeof HTMLScriptElement !== 'undefined') {
    var desc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
    if (desc && desc.set) {
      var origSet = desc.set;
      Object.defineProperty(HTMLScriptElement.prototype, 'src', {
        set: function(val) {
          if (typeof val === 'string' && (val.indexOf('googletagmanager.com/gtm.js') !== -1 || val.indexOf('loader.js') !== -1 || val.indexOf('/gtm.js') !== -1)) {
            if (val.indexOf(TARGET_CONTAINER_ID) !== -1) return origSet.call(this, val);
            log('Intercepted other GTM script, forcing ' + TARGET_CONTAINER_ID + ':', val);
            return origSet.call(this, buildTargetUrl(val));
          }
          return origSet.call(this, val);
        },
        get: desc.get, configurable: true
      });
    }
  }

  // 2. Remove any static GTM scripts already in DOM and replace with target
  function cleanAndInject() {
    var scripts = document.querySelectorAll('script[src*="gtm.js"], script[src*="loader.js"]');
    for (var i = 0; i < scripts.length; i++) {
      var s = scripts[i];
      var src = s.getAttribute('src');
      if (src && src.indexOf(TARGET_CONTAINER_ID) === -1) {
        log('Removing old GTM script:', src);
        if (s.parentNode) s.parentNode.removeChild(s);
        var replacement = document.createElement('script');
        replacement.async = true;
        replacement.src = buildTargetUrl(src);
        document.head.appendChild(replacement);
      }
    }
  }

  cleanAndInject();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', cleanAndInject);
  }

  // 3. Initialize dataLayer & gtag
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function() { window.dataLayer.push(arguments); };

  // 4. Inject target container if not yet present
  var inDOM = document.querySelector('script[src*="' + TARGET_CONTAINER_ID + '"]');
  var inGTM = window.google_tag_manager && window.google_tag_manager[TARGET_CONTAINER_ID];

  if (!inDOM && !inGTM) {
    var targetScript = document.createElement('script');
    targetScript.async = true;
    targetScript.src = buildTargetUrl('');
    document.head.appendChild(targetScript);
    log('Injected target container script:', targetScript.src);
  }

  log('Active. Locked to ' + TARGET_CONTAINER_ID);
})();
</script>
