<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tatvic Wrapper HTML Example</title>
  <!-- Load the Tatvic standalone script -->
  <script src="../dist/tatvic.js"></script>
</head>
<body>
  <!-- The Simple Wrapper -->
  <tatvic-wrapper>
    <div id="app">
      <h1>Vanilla HTML / PHP App</h1>

    </div>
  </tatvic-wrapper>
</body>
</html>
